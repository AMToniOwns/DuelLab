name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: Backend (build, tests, migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duellab
          POSTGRES_PASSWORD: duellab
          POSTGRES_DB: duellab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U duellab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DUELLAB_TEST_POSTGRES: Host=localhost;Port=5432;Username=duellab;Password=duellab;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger trx --results-directory TestResults
      - name: Check migrations are up to date
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes -p src/DuelLab.Infrastructure -s src/DuelLab.Api --no-build --configuration Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults

  frontend:
    name: Frontend (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/duellab-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/duellab-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx oxlint .
      - run: npx eslint .
      - run: npm run type-check
      - run: npx vitest run
      - run: npm run build-only

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duellab
          POSTGRES_PASSWORD: duellab
          POSTGRES_DB: duellab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U duellab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend/duellab-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/duellab-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: dotnet build ../../src/DuelLab.Api
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/duellab-web/playwright-report

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and on main, publish) the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/duellab:latest,ghcr.io/${{ github.repository_owner }}/duellab:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker build -t duellab:ci .
          docker network create duellab
          docker run -d --name db --network duellab -e POSTGRES_USER=duellab -e POSTGRES_PASSWORD=duellab -e POSTGRES_DB=duellab postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U duellab && break; sleep 2; done
          docker run -d --name app --network duellab -p 8080:8080 \
            -e ConnectionStrings__DuelLab="Host=db;Database=duellab;Username=duellab;Password=duellab" \
            -e CardCatalog__ImportOnStartup=false duellab:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 2; done
          curl -sf localhost:8080/health
          curl -sf localhost:8080/ | grep -q '<div id="app">'
          curl -sf localhost:8080/decks | grep -q '<div id="app">'   # SPA fallback
          docker logs app
